name: gps_face_recognition_app
description: "Aplikasi presensi karyawan dengan GPS geofencing dan face recognition on-device."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.0.0

  # HTTP client
  dio: ^5.4.3+1

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # General key-value storage
  shared_preferences: ^2.3.1

  # File storage
  path_provider: ^2.1.3

  # Face detection
  google_mlkit_face_detection: ^0.11.0

  # Camera
  camera: ^0.12.0

  # GPS
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Connectivity
  connectivity_plus: ^6.0.3

  # State management
  flutter_riverpod: ^2.5.1

  # Document viewer
  open_filex: ^4.4.0

  # File picker
  file_picker: ^8.0.7

  # Toast / snackbar
  fluttertoast: ^8.2.8

  # UUID
  uuid: ^4.4.0

  # Image processing
  image: ^4.2.0
  syncfusion_flutter_pdfviewer: ^33.2.13
  tflite_flutter: ^0.12.1
  safe_device: ^1.1.6
  sqflite: ^2.4.2
  path: ^1.9.1
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app-icon.jpg"
